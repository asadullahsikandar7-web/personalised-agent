name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build, typecheck, lint, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @personal-agent/shared build

      - name: Typecheck
        run: pnpm --filter @personal-agent/api typecheck

      - name: Lint
        run: pnpm --filter @personal-agent/api lint

      - name: Test
        run: pnpm --filter @personal-agent/api test
        env:
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-access-secret-not-for-production-use-only
          JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production-use-only
          AI_PROVIDER: mock

  mobile:
    name: Mobile (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @personal-agent/shared build

      - name: Typecheck
        run: pnpm --filter @personal-agent/mobile typecheck

      - name: Lint
        run: pnpm --filter @personal-agent/mobile lint

      - name: Test
        run: pnpm --filter @personal-agent/mobile test -- --ci
